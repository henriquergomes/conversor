name: Gerar Executável Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  build:
    name: Compilar Executável Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --noconsole --onefile --windowed --name "ConversorLaserDXF" --collect-all ezdxf --collect-all fitz app.py

      - name: Disponibilizar o arquivo .exe para Download
        uses: actions/upload-artifact@v4
        with:
          name: ConversorLaserDXF-Windows
          path: dist/ConversorLaserDXF.exe
          if-no-files-found: error
          retention-days: 14
